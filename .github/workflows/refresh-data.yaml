on:
  schedule:
    - cron: '*/53 00 * * *'
  workflow_dispatch:

name: refresh-data


env:
  RENV_PATHS_ROOT: ~/.local/share/renv

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-cpp-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Install packages
        run: Rscript -e 'install.packages(c("vctrs", "tidyverse", "lubridate", "magrittr", "here", "janitor", "readxl", "rvest", "glue", "pdftools", "httr"))'

      - name: Get data - TGP
        run: Rscript -e 'source(here::here("source", "go.R"), echo = TRUE)'

      - name: Commit
        run: |
          git config --global user.name 'Nick Twort'
          git config --global user.email 'nwbort@github.com'
          git add .
          git commit -m 'refreshing data' || echo "No changes to commit"
          git push || echo "No changes to commit"
